<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Personal Finance</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  :root {
    --page-bg: #03045E;
    --card: #FFFFFF;
    --surface: #EFF3FA;
    --primary: #99C3EC;
    --primary-dark: #3D6E9E;
    --primary-soft: #AAD2EC;
    --text: #201C33;
    --text-soft: #8D8AA0;
    --text-on-bg: #FFFFFF;
    --text-soft-on-bg: #B8C3F0;
    --border: #E4EEF6;
    --success: #1F8F63;
    --success-soft: #97E3C2;
    --danger: #C6485F;
    --danger-soft: #F69C9E;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--page-bg); color: var(--text); }
  input, select, button { font-family: 'Inter', sans-serif; font-size: 14px; }
  button { border: none; background: none; appearance: none; -webkit-appearance: none; cursor: pointer; box-shadow: none; }
  ::placeholder { color: #B4B2C6; }
  .num { font-variant-numeric: tabular-nums; }
  #app { display: flex; min-height: 100vh; width: 100%; }

  /* Sidebar */
  .sidebar { width: 84px; background: var(--card); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 24px 0; gap: 8px; flex-shrink: 0; }
  .logo { width: 40px; height: 40px; border-radius: 12px; background: var(--primary); display: flex; align-items: center; justify-content: center; margin-bottom: 24px; }
  .navicon { width: 44px; height: 44px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; cursor: pointer; font-size: 19px; color: #B4B2C6; transition: all .15s ease; }
  .navicon.active { background: var(--primary); color: var(--text); }

  /* Main */
  #main { flex: 1; padding: 32px 40px; width: 100%; min-width: 0; }
  h1.page-title { font-size: 26px; font-weight: 700; color: var(--text-on-bg); margin: 0 0 4px; }
  p.page-sub { font-size: 14px; color: var(--text-soft-on-bg); margin: 0 0 24px; }

  .card { background: var(--card); border-radius: 20px; box-shadow: 0 1px 2px rgba(32,28,51,.04), 0 8px 24px -12px rgba(32,28,51,.08); padding: 24px; }
  .grid-dash { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; align-items: start; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .col { display: flex; flex-direction: column; gap: 20px; }
  @media (max-width: 900px) { .grid-dash, .grid-2 { grid-template-columns: 1fr; } }

  .pill-toggle { display: flex; gap: 4px; padding: 4px; border-radius: 16px; background: var(--card); box-shadow: 0 4px 10px -2px rgba(32,28,51,.15); }
  .pill-toggle button { border: none; background: transparent; padding: 7px 16px; border-radius: 12px; font-size: 14px; font-weight: 500; color: var(--text-soft); cursor: pointer; text-transform: capitalize; }
  .pill-toggle button.active { background: var(--primary); color: var(--text); }

  .toggle-surface { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--surface); }
  .toggle-surface button { border: none; background: transparent; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 500; color: var(--text-soft); cursor: pointer; text-transform: capitalize; }
  .toggle-surface button.active { background: var(--primary); color: var(--text); }

  .btn { border: none; border-radius: 12px; padding: 10px 16px; font-size: 14px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 4px 10px -2px rgba(32,28,51,.15); }
  .btn-ghost { box-shadow: none; }
  .btn-primary { background: var(--primary); color: var(--text); }
  .btn-danger-soft { background: var(--danger-soft); color: var(--text); }
  .btn-outline { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost { background: transparent; color: var(--text-soft); }
  .btn-surface { background: var(--surface); color: var(--primary-dark); font-size: 12px; padding: 6px 12px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  .field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 500; color: var(--text-soft); }
  .field input, .field select { padding: 9px 12px; border-radius: 12px; border: 1px solid var(--border); font-size: 14px; color: var(--text); width: 100%; }
  .row-between { display: flex; align-items: center; justify-content: space-between; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 6px 12px; border-radius: 999px; background: var(--surface); color: var(--text); }
  .chip button { border: none; background: transparent; color: var(--text-soft); cursor: pointer; font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; flex-shrink: 0; }

  .list-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--border); }
  .list-row:first-child { border-top: none; }
  .empty-msg { font-size: 14px; color: var(--text-soft); text-align: center; padding: 24px 0; }

  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--text); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.2); z-index: 50; }
  .badge { font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 999px; }
  .dropzone { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 56px 16px; border: 2px dashed var(--border); border-radius: 20px; color: var(--text-soft); cursor: pointer; text-align: center; }
  .bar-scroll { overflow-x: auto; }
  .bar-scroll::-webkit-scrollbar { height: 5px; }
  .bar-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .bar-col { position: relative; cursor: pointer; }
  .bar-tip { display: none; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 10px; background: #1F2937; color: #fff; border-radius: 12px; padding: 10px 14px; font-size: 12px; white-space: nowrap; box-shadow: 0 10px 24px rgba(0,0,0,.35); z-index: 30; }
  .bar-tip .tip-title { font-weight: 600; margin-bottom: 6px; color: #fff; }
  .bar-tip .tip-row { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 2px 0; }
  .bar-tip .tip-row + .tip-row { margin-top: 2px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============ Utilities ============ */
const STORAGE_KEY = "ledger-finance-data";
const DEFAULT_DATA = {
  transactions: [],
  accounts: ["BCA", "Superbank", "Jago", "Shopeepay", "DANA", "OVO"],
  categories: ["Groceries", "Dining", "Transport", "Bills", "Shopping", "Salary", "Other"],
  currency: "Rp",
  viewPeriod: "monthly",
  dailyBudget: "",
  wealthBase: 0,
  wealthKeywords: ["Bibit", "Reksadana", "Saham", "Emas", "Dompet"],
  wealthAdjustments: [],
  wealthInstrumentBase: {},
  apiKey: "",
};
const PALETTE = ["#99C3EC", "#F69C9E", "#97E3C2", "#F0B429", "#BCECE6", "#AAD2EC"];
const ACCOUNT_COLORS = { bca: "#003399", superbank: "#DE5252", jago: "#00AB66", shopeepay: "#EE4D2D", dana: "#108EE9" };

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function fmtNum(n) { const sign = n < 0 ? "-" : ""; return sign + Math.abs(Math.round(n)).toLocaleString("id-ID"); }
function cur(n) { return ui.maskNumbers ? data.currency + " • • • • •" : data.currency + fmtNum(n); }
function fmtDate(dateStr) { const [y, m, d] = String(dateStr).split("-").map(Number); if (!y || !m || !d) return dateStr; return d + " " + new Date(y, m - 1, d).toLocaleString(undefined, { month: "short" }); }
function pad2(n) { return String(n).padStart(2, "0"); }
function toStr(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function todayStr() { return toStr(new Date()); }
function daysAgoStr(n) { const d = new Date(); d.setDate(d.getDate() - n); return toStr(d); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function colorFor(key, list) { const i = list.indexOf(key); return PALETTE[((i % PALETTE.length) + PALETTE.length) % PALETTE.length]; }
function keywordColor(key, list) { const i = list.indexOf(key); return PALETTE[(((i + 3) % PALETTE.length) + PALETTE.length) % PALETTE.length]; }
function accountColor(name, list) { return ACCOUNT_COLORS[String(name).toLowerCase()] || colorFor(name, list); }
function sumBy(txs, type) { return txs.filter((t) => t.type === type).reduce((s, t) => s + t.amount, 0); }
function barHeight(value, max) { if (!value) return 0; return Math.max((value / max) * 100, 8); }
function matchKeyword(t, keywords) { const hay = `${t.note || ""} ${t.category || ""}`.toLowerCase(); return keywords.find((k) => k && hay.includes(k.toLowerCase())); }
function keywordNet(keyword) {
  const keywords = data.wealthKeywords || [];
  const additions = data.transactions.filter((t) => matchKeyword(t, keywords) === keyword).reduce((s, t) => s + t.amount, 0);
  const cashouts = (data.wealthAdjustments || []).filter((a) => a.keyword === keyword).reduce((s, a) => s + a.amount, 0);
  return additions - cashouts;
}
function instrumentBase(keyword) { return parseFloat((data.wealthInstrumentBase || {})[keyword]) || 0; }
function instrumentValue(keyword) { return instrumentBase(keyword) + keywordNet(keyword); }
function mondayOf(d) { const day = d.getDay(); const diff = d.getDate() - day + (day === 0 ? -6 : 1); return new Date(d.getFullYear(), d.getMonth(), diff); }

function getRange(period, monthOffset) {
  if (period === "daily") return { start: todayStr(), end: todayStr() };
  if (period === "weekly") { const mon = mondayOf(new Date()); const sun = new Date(mon); sun.setDate(mon.getDate() + 6); return { start: toStr(mon), end: toStr(sun) }; }
  const now = new Date();
  const first = new Date(now.getFullYear(), now.getMonth() + monthOffset, 1);
  const last = new Date(now.getFullYear(), now.getMonth() + monthOffset + 1, 0);
  return { start: toStr(first), end: toStr(last) };
}
function getPrevRange(period, monthOffset) {
  if (period === "daily") return { start: daysAgoStr(1), end: daysAgoStr(1) };
  if (period === "weekly") { const mon = mondayOf(new Date()); const pMon = new Date(mon); pMon.setDate(mon.getDate() - 7); const pSun = new Date(mon); pSun.setDate(mon.getDate() - 1); return { start: toStr(pMon), end: toStr(pSun) }; }
  const now = new Date();
  const first = new Date(now.getFullYear(), now.getMonth() + monthOffset - 1, 1);
  const last = new Date(now.getFullYear(), now.getMonth() + monthOffset, 0);
  return { start: toStr(first), end: toStr(last) };
}
function cumulativeSeries(events, days) {
  const sorted = [...events].sort((a, b) => (a.date < b.date ? -1 : 1));
  let idx = 0, running = 0;
  return days.map((d) => { while (idx < sorted.length && sorted[idx].date <= d) { running += sorted[idx].amount; idx++; } return running; });
}
function rangeDays(period) {
  const days = [];
  const n = period === "weekly" ? 6 : new Date().getDate() - 1;
  for (let i = n; i >= 0; i--) days.push(daysAgoStr(i));
  days.push(todayStr());
  return [...new Set(days)];
}

/* ============ State ============ */
function loadData() {
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) return { ...DEFAULT_DATA, ...JSON.parse(raw) }; } catch (e) {}
  return { ...DEFAULT_DATA };
}
let data = loadData();
let ui = { tab: "dashboard", monthOffset: 0, chartPeriod: "weekly", cashoutOpen: false, wealthAddOpen: false, quickAddOpen: false, dailyBudgetEditing: false, importMode: "csv", csvParsed: null, screenshotState: "idle", screenshotParsed: null, toast: "", maskNumbers: false };

function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) { showToast("Could not save — storage full?"); } }
function persist(patch) { data = { ...data, ...patch }; save(); render(); }
function setUi(patch) { ui = { ...ui, ...patch }; render(); }
function showToast(msg) { ui.toast = msg; render(); clearTimeout(window.__toastT); window.__toastT = setTimeout(() => { ui.toast = ""; render(); }, 2400); }

/* ============ Icons (tiny inline SVGs) ============ */
const ICON = {
  dashboard: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>',
  wealth: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.5-11 6 0 1 0 3 2 4.5V21h4v-2h3v2h4v-4c1-.5 2-2 2-4 0-1 0-3-1-4"/><circle cx="15.5" cy="8.5" r=".5" fill="currentColor"/></svg>',
  plus: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
  upload: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 8l5-5 5 5M5 21h14"/></svg>',
  settings: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>',
  eye: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeOff: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/><line x1="3" y1="3" x2="21" y2="21"/></svg>',
  x: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>',
};

/* ============ Render root ============ */
function render() {
  const NAV = [
    { id: "dashboard", label: "Financial Tracker", icon: ICON.dashboard },
    { id: "wealth", label: "Wealth", icon: ICON.wealth },
    { id: "import", label: "Import", icon: ICON.upload },
    { id: "settings", label: "Accounts", icon: ICON.settings },
  ];
  const navHtml = NAV.map((n) => `<button class="navicon ${ui.tab === n.id ? "active" : ""}" title="${n.label}" onclick="setUi({tab:'${n.id}'})">${n.icon}</button>`).join("");

  let body = "";
  if (ui.tab === "dashboard") body = renderDashboard();
  else if (ui.tab === "wealth") body = renderWealth();
  else if (ui.tab === "import") body = renderImport();
  else if (ui.tab === "settings") body = renderSettings();

  document.getElementById("app").innerHTML = `
    <div class="sidebar">
      <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="var(--text)"><path d="M12 2l4 10-4 10-4-10z"/></svg></div>
      ${navHtml}
    </div>
    <div id="main">${body}</div>
    ${ui.toast ? `<div class="toast">✓ ${esc(ui.toast)}</div>` : ""}
  `;
}

/* ============ Dashboard ============ */
function renderDashboard() {
  const period = data.viewPeriod || "monthly";
  const { start, end } = getRange(period, ui.monthOffset);
  const prev = getPrevRange(period, ui.monthOffset);
  const rangeTx = data.transactions.filter((t) => t.date >= start && t.date <= end);
  const prevTx = data.transactions.filter((t) => t.date >= prev.start && t.date <= prev.end);

  const income = sumBy(rangeTx, "income");
  const expense = sumBy(rangeTx, "expense");
  const net = income - expense;
  const prevNet = sumBy(prevTx, "income") - sumBy(prevTx, "expense");
  const netDelta = net - prevNet;

  const byAccount = {};
  data.accounts.forEach((a) => (byAccount[a] = 0));
  data.transactions.forEach((t) => (byAccount[t.account] = (byAccount[t.account] || 0) + (t.type === "income" ? t.amount : -t.amount)));
  const totalBalance = Object.values(byAccount).reduce((s, v) => s + v, 0);
  const positiveAccounts = data.accounts.filter((a) => (byAccount[a] || 0) > 0);
  const positiveSum = positiveAccounts.reduce((s, a) => s + byAccount[a], 0) || 1;

  const byCategory = {};
  rangeTx.filter((t) => t.type === "expense").forEach((t) => (byCategory[t.category] = (byCategory[t.category] || 0) + t.amount));
  const catRows = Object.entries(byCategory).sort((a, b) => b[1] - a[1]);
  const catTotal = catRows.reduce((s, [, v]) => s + v, 0) || 1;

  let bars = [];
  { const startD = new Date(start), endD = new Date(end);
    for (let d = new Date(startD); d <= endD; d.setDate(d.getDate() + 1)) {
      const dateStr = toStr(d);
      const dayTx = data.transactions.filter((t) => t.date === dateStr);
      const label = period === "monthly" ? String(d.getDate()) : d.toLocaleDateString(undefined, { weekday: "short" });
      bars.push({ date: dateStr, income: sumBy(dayTx, "income"), expense: sumBy(dayTx, "expense"), label });
    }
  }
  const maxBar = Math.max(...bars.map((b) => Math.max(b.income, b.expense)), 1);
  const monthDate = new Date(new Date().getFullYear(), new Date().getMonth() + ui.monthOffset, 1);
  const periodLabel = period === "daily" ? "Today" : period === "weekly" ? "This week (Mon–Sun)" : monthDate.toLocaleString(undefined, { month: "long", year: "numeric" });
  const recent = [...rangeTx].sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 8);

  let statsBody = "";
  if (period === "daily") {
    statsBody = renderDailyProgress(expense);
  } else if (period === "weekly") {
    statsBody = `<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:4px;height:140px">` +
      bars.map((b) => `
        <div class="bar-col" style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;flex:1" onmouseenter="this.querySelector('.bar-tip').style.display='block'" onmouseleave="this.querySelector('.bar-tip').style.display='none'" onclick="const t=this.querySelector('.bar-tip'); t.style.display = t.style.display==='block' ? 'none' : 'block'">
          <div class="bar-tip">
            <div class="tip-title">${b.label} · ${fmtDate(b.date)}</div>
            <div class="tip-row"><span style="display:flex;align-items:center;gap:6px"><span class="dot" style="background:var(--primary)"></span>Income</span><b>${cur(b.income)}</b></div>
            <div class="tip-row"><span style="display:flex;align-items:center;gap:6px"><span class="dot" style="background:var(--danger-soft)"></span>Expenses</span><b>${cur(b.expense)}</b></div>
          </div>
          <div style="display:flex;align-items:flex-end;gap:4px;height:100%">
            <div style="width:10px;border-radius:999px;background:var(--primary);height:${barHeight(b.income, maxBar)}%"></div>
            <div style="width:10px;border-radius:999px;background:var(--danger-soft);height:${barHeight(b.expense, maxBar)}%"></div>
          </div>
          <span style="font-size:10px;color:var(--text-soft)">${b.label}</span>
        </div>`).join("") + `</div>`;
  } else {
    statsBody = `<div class="bar-scroll"><div style="display:flex;align-items:flex-end;gap:12px;height:140px;min-width:${bars.length > 10 ? bars.length * 34 + "px" : "100%"}">` +
      bars.map((b) => `
        <div class="bar-col" style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;width:24px" onmouseenter="this.querySelector('.bar-tip').style.display='block'" onmouseleave="this.querySelector('.bar-tip').style.display='none'" onclick="const t=this.querySelector('.bar-tip'); t.style.display = t.style.display==='block' ? 'none' : 'block'">
          <div class="bar-tip">
            <div class="tip-title">${b.label} · ${fmtDate(b.date)}</div>
            <div class="tip-row"><span style="display:flex;align-items:center;gap:6px"><span class="dot" style="background:var(--primary)"></span>Income</span><b>${cur(b.income)}</b></div>
            <div class="tip-row"><span style="display:flex;align-items:center;gap:6px"><span class="dot" style="background:var(--danger-soft)"></span>Expenses</span><b>${cur(b.expense)}</b></div>
          </div>
          <div style="display:flex;align-items:flex-end;gap:2px;height:100%">
            <div style="width:8px;border-radius:999px;background:var(--primary);height:${barHeight(b.income, maxBar)}%"></div>
            <div style="width:8px;border-radius:999px;background:var(--danger-soft);height:${barHeight(b.expense, maxBar)}%"></div>
          </div>
          <span style="font-size:10px;color:var(--text-soft)">${b.label}</span>
        </div>`).join("") + `</div></div>`;
  }

  return `
    <div class="row-between" style="margin-bottom:24px">
      <h1 class="page-title" style="margin:0">Financial Tracker</h1>

function renderDailyProgress(expense) {
  const budget = parseFloat(data.dailyBudget) || 0;
  const hasBudget = budget > 0;
  const pct = hasBudget ? Math.min((expense / budget) * 100, 100) : 0;
  const over = hasBudget && expense > budget;
  return `
    <div class="row-between" style="align-items:flex-end">
      <div>
        <div class="num" style="font-size:28px;font-weight:800">${cur(expense)}</div>
        <div style="font-size:12px;color:var(--text-soft);margin-top:4px">spent today</div>
      </div>
      <button class="btn btn-surface" onclick="setUi({dailyBudgetEditing:${!ui.dailyBudgetEditing}})">${hasBudget ? "✎ Edit daily limit" : "+ Set daily limit"}</button>
    </div>
    ${ui.dailyBudgetEditing ? `
      <div style="display:flex;gap:8px;margin-top:14px">
        <input type="number" id="daily-budget-input" placeholder="e.g. 150000" value="${esc(data.dailyBudget || "")}" style="flex:1;padding:9px 12px;border-radius:12px;border:1px solid var(--border);font-size:14px">
        <button class="btn btn-primary" onclick="saveDailyBudget()">Save</button>
        <button class="btn btn-ghost" onclick="setUi({dailyBudgetEditing:false})">Cancel</button>
      </div>` : ""}
    ${hasBudget && !ui.dailyBudgetEditing ? `
      <div style="margin-top:18px">
        <div style="height:12px;border-radius:999px;overflow:hidden;background:var(--surface)">
          <div style="height:100%;border-radius:999px;background:${over ? "var(--danger-soft)" : "var(--primary)"};width:${pct}%"></div>
        </div>
        <div class="row-between" style="font-size:12px;color:var(--text-soft);margin-top:8px">
          <span>${Math.round(pct)}% of ${cur(budget)} limit</span>
          <span style="font-weight:500;color:${over ? "var(--danger)" : "var(--success)"}">${over ? `${cur(expense - budget)} over` : `${cur(budget - expense)} left`}</span>
        </div>
      </div>` : !hasBudget && !ui.dailyBudgetEditing ? `<div style="font-size:12px;color:var(--text-soft);margin-top:16px">Set a daily limit to see your spending progress here.</div>` : ""}
  `;
}
function saveDailyBudget() {
  const v = document.getElementById("daily-budget-input").value;
  persist({ dailyBudget: v === "" ? "" : Math.max(0, parseFloat(v) || 0) });
  ui.dailyBudgetEditing = false; render();
}

function renderDonut(rows, total) {
  const size = 150, r = 55, c = 2 * Math.PI * r; let offset = 0;
  const segs = rows.map(([cat, amt]) => {
    const frac = amt / total, dash = frac * c;
    const seg = `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${colorFor(cat, data.categories)}" stroke-width="16" stroke-dasharray="${dash} ${c - dash}" stroke-dashoffset="${-offset}" />`;
    offset += dash; return seg;
  }).join("");
  return `
    <div style="position:relative;width:${size}px;height:${size}px">
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
        <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--border)" stroke-width="16" />
        ${segs}
      </svg>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
        <div class="num" style="font-size:17px;font-weight:700">${cur(total === 1 && rows.length === 0 ? 0 : total)}</div>
        <div style="font-size:10px;color:var(--text-soft)">Total Expenses</div>
      </div>
    </div>`;
}
function removeTx(id) { persist({ transactions: data.transactions.filter((t) => t.id !== id) }); }

function renderCsvImport() {

      </div>
      <div style="display:flex;gap:12px;margin-top:16px">
        <button class="btn btn-primary" onclick="doCsvImport()">Import ${p.rows.length} transactions</button>
        <button class="btn btn-outline" onclick="setUi({csvParsed:null})">Cancel</button>
      </div>

    </div>

function handleCsvFile(e) {
  const file = e.target.files[0]; if (!file) return;
  Papa.parse(file, { header: true, skipEmptyLines: true, complete: (res) => {
    const cols = res.meta.fields || [];
    const guess = (keys) => cols.find((c) => keys.some((k) => c.toLowerCase().includes(k)));
    ui.csvParsed = { fileName: file.name, headers: cols, rows: res.data,
      dateCol: guess(["date"]) || cols[0] || "", descCol: guess(["desc", "memo", "narrative", "detail"]) || cols[1] || "", amountCol: guess(["amount", "value", "debit", "credit"]) || cols[2] || "" };
    render();
  }, error: () => showToast("Could not read that file") });
}
function doCsvImport() {
  const p = ui.csvParsed;
  const dateCol = document.getElementById("csv-date").value, amountCol = document.getElementById("csv-amount").value, descCol = document.getElementById("csv-desc").value;
  const account = document.getElementById("csv-account").value, category = document.getElementById("csv-category").value, flip = document.getElementById("csv-flip").checked;
  const imported = p.rows.map((r) => {
    let amt = parseFloat(String(r[amountCol]).replace(/[^0-9.-]/g, "")); if (isNaN(amt)) return null;
    if (flip) amt = -amt;
    return { id: uid(), date: r[dateCol] || todayStr(), amount: Math.abs(amt), type: amt < 0 ? "expense" : "income", account, category, note: descCol ? r[descCol] : "" };
  }).filter(Boolean);
  data.transactions = [...imported, ...data.transactions]; save();
  showToast(`Imported ${imported.length} transactions`); ui.csvParsed = null; render();
}

}
function saveApiKey() { const v = document.getElementById("api-key-input").value.trim(); persist({ apiKey: v }); showToast("API key saved locally"); }
function fileToBase64(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result.split(",")[1]); r.onerror = () => rej(new Error("read failed")); r.readAsDataURL(file); }); }

async function handleScreenshotFile(e) {
  const file = e.target.files[0]; if (!file) return;
  if (!data.apiKey) { showToast("Paste your Anthropic API key below first"); return; }
  ui.screenshotState = "reading"; render();
  try {
    const base64 = await fileToBase64(file);
    const mediaType = file.type || "image/png";
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-api-key": data.apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6", max_tokens: 1000,
        messages: [{ role: "user", content: [
          { type: "image", source: { type: "base64", media_type: mediaType, data: base64 } },
          { type: "text", text: `This is a screenshot of a banking or e-wallet app's transaction history (likely Indonesian: BCA, Superbank, Jago, Shopeepay, DANA, OVO, or similar). Extract every transaction line you can see.

Respond with ONLY a raw JSON array, no markdown fences, no preamble. Each item:
{"date": "YYYY-MM-DD", "description": "short merchant/label text", "amount": number (positive, no currency symbol/separators), "type": "income" or "expense"}

Rules:
- If year isn't visible, assume ${new Date().getFullYear()}.
- Red text/minus sign/words like "debit","terkirim","pembayaran" usually mean "expense". Green/plus sign/"credit","diterima","masuk" usually mean "income".
- If nothing found, respond with [].` },
        ]}],
      }),
    });
    const json = await response.json();
    if (json.error) throw new Error(json.error.message || "API error");
    const text = (json.content || []).map((b) => b.text || "").join("\n");
    const arr = JSON.parse(text.replace(/```json|```/g, "").trim());
    ui.screenshotParsed = arr.map((r) => ({ ...r }));
    ui.screenshotState = "done"; render();
    if (arr.length === 0) showToast("No transactions found in that image");
  } catch (err) {
    ui.screenshotState = "error"; render();
    showToast("Could not read that screenshot: " + err.message);
  }
}
function doScreenshotImport() {
  const account = document.getElementById("ss-account").value, category = document.getElementById("ss-category").value;
  const imported = (ui.screenshotParsed || []).map((r) => ({ id: uid(), date: r.date || todayStr(), amount: Math.abs(parseFloat(r.amount)) || 0, type: r.type === "income" ? "income" : "expense", account, category, note: r.description || "" }));
  data.transactions = [...imported, ...data.transactions]; save();
  showToast(`Imported ${imported.length} transactions`);
  ui.screenshotState = "idle"; ui.screenshotParsed = null; render();
}

/* ============ Accounts & Categories ============ */
function renderSettings() {
  return `
    <h1 class="page-title">Accounts & Categories</h1>
    <p class="page-sub">Set up your banks, e-wallets, and spending categories once — then reuse them everywhere.</p>
    <div class="grid-2">
      <div>
        <h2 style="font-size:13px;font-weight:600;color:var(--text-soft-on-bg);margin:0 0 8px">ACCOUNTS</h2>
        <div class="card" style="padding:0">
          ${data.accounts.map((a) => `<div class="list-row" style="padding:10px 16px"><span style="display:flex;align-items:center;gap:8px;font-size:14px"><span class="dot" style="background:${accountColor(a, data.accounts)}"></span>${esc(a)}</span><button class="btn-ghost" style="padding:2px" onclick="removeAccount('${esc(a)}')">${ICON.x}</button></div>`).join("")}
        </div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <input id="new-account" placeholder="e.g. GoPay" style="flex:1;padding:8px 12px;border-radius:12px;border:1px solid var(--border);font-size:14px">
          <button class="btn btn-primary" onclick="addAccount()">Add</button>
        </div>
      </div>
      <div>
        <h2 style="font-size:13px;font-weight:600;color:var(--text-soft-on-bg);margin:0 0 8px">CATEGORIES</h2>
        <div class="card" style="padding:0">
          ${data.categories.map((c) => `<div class="list-row" style="padding:10px 16px"><span style="display:flex;align-items:center;gap:8px;font-size:14px"><span class="dot" style="background:${colorFor(c, data.categories)}"></span>${esc(c)}</span><button class="btn-ghost" style="padding:2px" onclick="removeCategory('${esc(c)}')">${ICON.x}</button></div>`).join("")}
        </div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <input id="new-category" placeholder="e.g. Subscriptions" style="flex:1;padding:8px 12px;border-radius:12px;border:1px solid var(--border);font-size:14px">
          <button class="btn btn-primary" onclick="addCategory()">Add</button>
        </div>
      </div>
    </div>
    <h2 style="font-size:13px;font-weight:600;color:var(--text-soft-on-bg);margin:24px 0 8px">CURRENCY SYMBOL</h2>
    <input value="${esc(data.currency)}" onchange="persist({currency:this.value})" style="width:160px;padding:8px 12px;border-radius:12px;border:1px solid var(--border);font-size:14px">
    <div style="margin-top:24px">
      <button class="btn btn-outline" onclick="exportCsv()">⬇ Export all transactions as CSV</button>
    </div>
  `;
}
function addAccount() { const v = document.getElementById("new-account").value.trim(); if (!v || data.accounts.includes(v)) return; persist({ accounts: [...data.accounts, v] }); }
function removeAccount(a) { persist({ accounts: data.accounts.filter((x) => x !== a) }); }
function addCategory() { const v = document.getElementById("new-category").value.trim(); if (!v || data.categories.includes(v)) return; persist({ categories: [...data.categories, v] }); }
function removeCategory(c) { persist({ categories: data.categories.filter((x) => x !== c) }); }
function exportCsv() {
  const csv = Papa.unparse(data.transactions.map((t) => ({ date: t.date, type: t.type, account: t.account, category: t.category, amount: t.amount, note: t.note })));
  const blob = new Blob([csv], { type: "text/csv" }); const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = "transactions.csv"; a.click(); URL.revokeObjectURL(url);
}

/* ============ Wealth ============ */
let wealthEditing = false, wealthCoKeyword = null;
function renderWealth() {
  const keywords = data.wealthKeywords || [];
  const adjustments = data.wealthAdjustments || [];
  const detected = data.transactions.map((t) => ({ t, match: matchKeyword(t, keywords) })).filter((x) => x.match);
  const additionsSum = detected.reduce((s, x) => s + x.t.amount, 0);
  const cashoutSum = adjustments.reduce((s, a) => s + a.amount, 0);
  const netAuto = additionsSum - cashoutSum;
  const instrumentBaseSum = keywords.reduce((s, k) => s + instrumentBase(k), 0);
  const totalWealth = (parseFloat(data.wealthBase) || 0) + instrumentBaseSum + netAuto;
  if (!wealthCoKeyword) wealthCoKeyword = keywords[0] || "";

  const days = rangeDays(ui.chartPeriod);
  const dayLabels = days.map((d) => (ui.chartPeriod === "monthly" ? String(new Date(d).getDate()) : new Date(d).toLocaleDateString(undefined, { weekday: "short" })));
  const series = keywords.map((k) => {
    const events = [...detected.filter((x) => x.match === k).map((x) => ({ date: x.t.date, amount: x.t.amount })), ...adjustments.filter((a) => a.keyword === k).map((a) => ({ date: a.date, amount: -a.amount }))];
    const base = instrumentBase(k);
    return { keyword: k, values: cumulativeSeries(events, days).map((v) => v + base) };
  });
  const globalMax = Math.max(...series.flatMap((s) => s.values), 1);
  const globalMin = Math.min(...series.flatMap((s) => s.values), 0);
  const span = globalMax - globalMin || 1;
  const chartW = 560, chartH = 150;

  const history = [
    ...detected.map((x) => ({ id: x.t.id, date: x.t.date, label: x.t.note || x.t.category, keyword: x.match, amount: x.t.amount, kind: "addition" })),
    ...adjustments.map((a) => ({ id: a.id, date: a.date, label: a.note || `Cashout — ${a.keyword}`, keyword: a.keyword, amount: a.amount, kind: "cashout" })),
  ].sort((a, b) => (a.date < b.date ? 1 : -1));

  return `
    <div class="row-between" style="margin-bottom:4px">
      <h1 class="page-title" style="margin:0">Wealth Dashboard</h1>
      <button class="btn btn-outline" onclick="setUi({cashoutOpen:${!ui.cashoutOpen}, wealthAddOpen:false})">↘ Cash Out</button>
    </div>
    <p class="page-sub">Track your total net worth — update it manually anytime, or let it grow automatically when your expenses go toward investments.</p>

    ${ui.cashoutOpen ? `
      <form class="card" style="margin-bottom:20px" onsubmit="submitCashout(event)">
        <h2 style="margin:0 0 12px;font-size:14px;font-weight:600">Record a cash out</h2>
        <div class="grid-2" style="gap:12px">
          <div class="field">Instrument<select id="co-keyword">${keywords.map((k) => `<option>${esc(k)}</option>`).join("")}</select></div>
          <div class="field">Amount (${data.currency})<input type="number" id="co-amount" placeholder="0"></div>
          <div class="field">Date<input type="date" id="co-date" value="${todayStr()}"></div>
          <div class="field">Deposit to account (optional)<select id="co-account"><option value="">Don't log as income</option>${data.accounts.map((a) => `<option>${esc(a)}</option>`).join("")}</select></div>
          <div class="field" style="grid-column:span 2">Note (optional)<input type="text" id="co-note" placeholder="e.g. partial withdrawal"></div>
        </div>
        <div style="display:flex;gap:8px;margin-top:16px">
          <button type="submit" class="btn btn-danger-soft">Record cash out</button>
          <button type="button" class="btn btn-ghost" onclick="setUi({cashoutOpen:false})">Cancel</button>
        </div>
      </form>` : ""}

    <div class="grid-dash" style="grid-template-columns:1.4fr 1fr">
      <div class="col">
        <div class="card">
          <div class="row-between">
            <div>
              <div style="font-size:12px;font-weight:500;color:var(--text-soft)">Total Wealth</div>
              <div class="num" style="font-size:28px;font-weight:800;margin-top:4px">${cur(totalWealth)}</div>
            </div>
            <button class="btn btn-surface" onclick="setUi({wealthAddOpen:${!ui.wealthAddOpen}, cashoutOpen:false})">✎ Update</button>
          </div>
          <div style="display:flex;gap:16px;margin-top:12px;font-size:12px">
            ${additionsSum > 0 ? `<span style="color:var(--success)">▲ +${cur(additionsSum)} added</span>` : ""}
            ${cashoutSum > 0 ? `<span style="color:var(--danger)">▼ -${cur(cashoutSum)} cashed out</span>` : ""}
          </div>
          ${ui.wealthAddOpen ? `
            <form onsubmit="submitInstrumentUpdate(event)" style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border)">
              <p style="font-size:12px;color:var(--text-soft);margin:0 0 10px">Since this isn't connected to Bibit, GoTrade, or your other apps, tell it what each instrument is actually worth right now.</p>
              <div class="grid-2" style="gap:12px">
                <div class="field">Instrument<select id="iv-keyword">${keywords.length === 0 ? `<option value="">Add a keyword first</option>` : keywords.map((k) => `<option>${esc(k)}</option>`).join("")}</select></div>
                <div class="field">Current value (${data.currency})<input type="number" id="iv-value" placeholder="e.g. 500000"></div>
              </div>
              <div style="display:flex;gap:8px;margin-top:14px">
                <button type="submit" class="btn btn-primary">Save value</button>
                <button type="button" class="btn btn-ghost" onclick="setUi({wealthAddOpen:false})">Cancel</button>
              </div>
            </form>` : ""}
        </div>

        <div class="card">
          <div class="row-between" style="margin-bottom:4px">
            <h2 style="margin:0;font-size:15px;font-weight:600">Instrument Performance</h2>
            <div class="toggle-surface">
              ${["weekly", "monthly"].map((p) => `<button class="${ui.chartPeriod === p ? "active" : ""}" onclick="setUi({chartPeriod:'${p}'})">${p}</button>`).join("")}
            </div>
          </div>
          <p style="font-size:12px;color:var(--text-soft);margin:0 0 16px">Cumulative value per instrument, ${ui.chartPeriod === "weekly" ? "last 7 days" : "this month"}</p>
          ${keywords.length === 0 ? `<div class="empty-msg">Add an investment keyword to see its trend here.</div>` : `
            <div style="position:relative">
              <svg width="100%" viewBox="0 0 ${chartW} ${chartH}" preserveAspectRatio="none" style="height:150px;display:block">
                <line x1="0" y1="${chartH - ((0 - globalMin) / span) * chartH}" x2="${chartW}" y2="${chartH - ((0 - globalMin) / span) * chartH}" stroke="var(--border)" stroke-width="1" />
                ${series.map((s) => {
                  const pts = s.values.map((v, i) => { const x = days.length > 1 ? (i / (days.length - 1)) * chartW : 0; const y = chartH - ((v - globalMin) / span) * chartH; return `${x},${y}`; });
                  return `<polyline points="${pts.join(" ")}" fill="none" stroke="${keywordColor(s.keyword, keywords)}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />`;
                }).join("")}
              </svg>
              <div style="position:absolute;inset:0;display:flex">
                ${days.map((d, i) => `
                  <div class="bar-col" style="flex:1;height:100%" onmouseenter="this.querySelector('.bar-tip').style.display='block'" onmouseleave="this.querySelector('.bar-tip').style.display='none'" onclick="const t=this.querySelector('.bar-tip'); t.style.display = t.style.display==='block' ? 'none' : 'block'">
                    <div class="bar-tip">
                      <div class="tip-title">${dayLabels[i]} · ${d}</div>
                      ${series.map((s) => `<div class="tip-row"><span style="display:flex;align-items:center;gap:6px"><span class="dot" style="background:${keywordColor(s.keyword, keywords)}"></span>${esc(s.keyword)}</span><b>${cur(s.values[i] || 0)}</b></div>`).join("")}
                    </div>
                  </div>`).join("")}
              </div>
            </div>
            <div class="row-between" style="font-size:10px;color:var(--text-soft);margin-top:4px"><span>${dayLabels[0]}</span><span>${dayLabels[dayLabels.length - 1]}</span></div>
            <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:14px">
              ${series.map((s) => `<span style="display:flex;align-items:center;gap:6px;font-size:12px"><span class="dot" style="background:${keywordColor(s.keyword, keywords)}"></span>${esc(s.keyword)}<span class="num" style="color:var(--text-soft)">${cur(s.values[s.values.length - 1] || 0)}</span></span>`).join("")}
            </div>`}
        </div>

        <div class="card">
          <h2 style="margin:0 0 4px;font-size:15px;font-weight:600">Transaction History</h2>
          <p style="font-size:12px;color:var(--text-soft);margin:0 0 12px">Additions detected from your expenses, plus any cash outs you've recorded.</p>
          ${history.length === 0 ? `<div class="empty-msg">Nothing yet. Try logging an expense with "Bibit" or another keyword in the note.</div>` : history.slice(0, 12).map((h) => `
            <div class="list-row">
              <div style="display:flex;align-items:center;gap:12px">
                <span class="dot" style="background:${keywordColor(h.keyword, keywords)}"></span>
                <div><div style="font-size:14px;font-weight:500">${esc(h.label)}</div><div style="font-size:12px;color:var(--text-soft)">${fmtDate(h.date)} · ${esc(h.keyword)}</div></div>
              </div>
              <div style="display:flex;align-items:center;gap:10px">
                <span class="num" style="font-size:14px;font-weight:600;color:${h.kind === "addition" ? "var(--success)" : "var(--danger)"}">${h.kind === "addition" ? "+" : "-"}${cur(h.amount)}</span>
              </div>
            </div>`).join("")}
        </div>
      </div>

      <div class="card" style="height:fit-content">
        <h2 style="margin:0 0 4px;font-size:15px;font-weight:600">Investment Keywords</h2>
        <p style="font-size:12px;color:var(--text-soft);margin:0 0 12px">Words to watch for in a transaction's note or category — e.g. "Bibit", "Dompet X", "Saham".</p>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">
          ${keywords.map((k) => `<span class="chip"><span class="dot" style="background:${keywordColor(k, keywords)}"></span>${esc(k)}<button onclick="removeWealthKeyword('${esc(k)}')">${ICON.x}</button></span>`).join("") || `<span style="font-size:14px;color:var(--text-soft)">No keywords yet.</span>`}
        </div>
        <div style="display:flex;gap:8px">
          <input id="new-keyword" placeholder="e.g. Dompet X" style="flex:1;padding:8px 12px;border-radius:12px;border:1px solid var(--border);font-size:14px">
          <button class="btn btn-primary" onclick="addWealthKeyword()">Add</button>
        </div>
      </div>
    </div>
  `;
}
function submitInstrumentUpdate(e) {
  e.preventDefault();
  const keyword = document.getElementById("iv-keyword").value;
  const entered = parseFloat(document.getElementById("iv-value").value);
  if (!keyword || isNaN(entered)) { showToast("Choose an instrument and enter a value"); return; }
  const newBase = entered - keywordNet(keyword);
  const map = { ...(data.wealthInstrumentBase || {}), [keyword]: newBase };
  persist({ wealthInstrumentBase: map });
  showToast(`${keyword} set to ${data.currency}${fmtNum(entered)}`);
  ui.wealthAddOpen = false; render();
}
function addWealthKeyword() { const v = document.getElementById("new-keyword").value.trim(); if (!v || (data.wealthKeywords || []).includes(v)) return; persist({ wealthKeywords: [...(data.wealthKeywords || []), v] }); }
function removeWealthKeyword(k) { persist({ wealthKeywords: (data.wealthKeywords || []).filter((x) => x !== k) }); }
function submitCashout(e) {
  e.preventDefault();
  const keyword = document.getElementById("co-keyword").value, amount = parseFloat(document.getElementById("co-amount").value);
  const date = document.getElementById("co-date").value || todayStr(), account = document.getElementById("co-account").value, note = document.getElementById("co-note").value;
  if (!amount || amount <= 0 || !keyword) { showToast("Choose an instrument and amount"); return; }
  const adj = { id: uid(), date, keyword, amount, note };
  data.wealthAdjustments = [adj, ...(data.wealthAdjustments || [])];
  if (account) data.transactions = [{ id: uid(), date, amount, type: "income", account, category: "Cashout", note: note || `Cashout from ${keyword}` }, ...data.transactions];
  save(); showToast("Cashout recorded"); ui.cashoutOpen = false; render();
}

/* ============ Init ============ */
render();
</script>
</body>
