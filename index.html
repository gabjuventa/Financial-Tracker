  .row-between { display: flex; align-items: center; justify-content: space-between; }

  .chip button { border: none; background: transparent; color: var(--text-soft); cursor: pointer; font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; flex-shrink: 0; }

  .list-row:first-child { border-top: none; }
  .empty-msg { font-size: 14px; color: var(--text-soft); text-align: center; padding: 24px 0; }

  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--text); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.2); z-index: 50; }
  .badge { font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 999px; }
  .dropzone { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 56px 16px; border: 2px dashed var(--border); border-radius: 20px; color: var(--text-soft); cursor: pointer; text-align: center; }
  .bar-scroll { overflow-x: auto; width: 100%; max-width: 100%; -webkit-overflow-scrolling: touch; }

  .tx-scroll { display: flex; gap: 10px; overflow-x: auto; width: 100%; max-width: 100%; padding-bottom: 4px; -webkit-overflow-scrolling: touch; scroll-snap-type: x proximity; }
  .tx-scroll::-webkit-scrollbar { height: 5px; }

  .tx-card { flex: 0 0 220px; border: 1px solid var(--border); border-radius: 14px; padding: 12px; scroll-snap-align: start; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(3,4,94,.45); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal-box { background: var(--card); border-radius: 20px; padding: 24px; width: 100%; max-width: 380px; max-height: 90vh; overflow-y: auto; }
  .bar-col { position: relative; cursor: pointer; }
  .bar-tip { display: none; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 10px; background: #1F2937; color: #fff; border-radius: 12px; padding: 10px 14px; font-size: 12px; white-space: nowrap; box-shadow: 0 10px 24px rgba(0,0,0,.35); z-index: 30; }

  .bar-tip .tip-row + .tip-row { margin-top: 2px; }
</style>

const PALETTE = ["#99C3EC", "#F69C9E", "#97E3C2", "#F0B429", "#BCECE6", "#AAD2EC"];
const ACCOUNT_COLORS = { bca: "#003399", superbank: "#DE5252", jago: "#00AB66", shopeepay: "#EE4D2D", dana: "#108EE9" };

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function formatAmountInput(el) { const digits = el.value.replace(/[^\d]/g, ""); el.value = digits ? Number(digits).toLocaleString("id-ID") : ""; }
function parseAmountInput(str) { return parseFloat(String(str || "").replace(/[^\d]/g, "")) || 0; }
function fmtNum(n) { const sign = n < 0 ? "-" : ""; return sign + Math.abs(Math.round(n)).toLocaleString("id-ID"); }
function cur(n) { return ui.maskNumbers ? data.currency + " • • • • •" : data.currency + fmtNum(n); }
function fmtDate(dateStr) { const [y, m, d] = String(dateStr).split("-").map(Number); if (!y || !m || !d) return dateStr; return d + " " + new Date(y, m - 1, d).toLocaleString(undefined, { month: "short" }); }
function pad2(n) { return String(n).padStart(2, "0"); }
function toStr(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function todayStr() { return toStr(new Date()); }
function daysAgoStr(n) { const d = new Date(); d.setDate(d.getDate() - n); return toStr(d); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function colorFor(key, list) { const i = list.indexOf(key); return PALETTE[((i % PALETTE.length) + PALETTE.length) % PALETTE.length]; }
function keywordColor(key, list) { const i = list.indexOf(key); return PALETTE[(((i + 3) % PALETTE.length) + PALETTE.length) % PALETTE.length]; }
function accountColor(name, list) { return ACCOUNT_COLORS[String(name).toLowerCase()] || colorFor(name, list); }
function sumBy(txs, type) { return txs.filter((t) => t.type === type).reduce((s, t) => s + t.amount, 0); }
function barHeight(value, max) { if (!value) return 0; return Math.max((value / max) * 100, 8); }
function matchKeyword(t, keywords) { const hay = `${t.note || ""} ${t.category || ""}`.toLowerCase(); return keywords.find((k) => k && hay.includes(k.toLowerCase())); }
function keywordNet(keyword) {
  const keywords = data.wealthKeywords || [];
  const additions = data.transactions.filter((t) => matchKeyword(t, keywords) === keyword).reduce((s, t) => s + t.amount, 0);
  const cashouts = (data.wealthAdjustments || []).filter((a) => a.keyword === keyword).reduce((s, a) => s + a.amount, 0);
  return additions - cashouts;
}
function instrumentBase(keyword) { return parseFloat((data.wealthInstrumentBase || {})[keyword]) || 0; }
function instrumentValue(keyword) { return instrumentBase(keyword) + keywordNet(keyword); }
function mondayOf(d) { const day = d.getDay(); const diff = d.getDate() - day + (day === 0 ? -6 : 1); return new Date(d.getFullYear(), d.getMonth(), diff); }

function offsetDayStr(n) { const d = new Date(); d.setDate(d.getDate() + n); return toStr(d); }
function getRange(period, monthOffset) {
  if (period === "daily") { const s = offsetDayStr(monthOffset); return { start: s, end: s }; }
  if (period === "weekly") { const mon = mondayOf(new Date()); const sun = new Date(mon); sun.setDate(mon.getDate() + 6); return { start: toStr(mon), end: toStr(sun) }; }
  const now = new Date();
  const first = new Date(now.getFullYear(), now.getMonth() + monthOffset, 1);
  const last = new Date(now.getFullYear(), now.getMonth() + monthOffset + 1, 0);
  return { start: toStr(first), end: toStr(last) };
}
function getPrevRange(period, monthOffset) {
  if (period === "daily") { const s = offsetDayStr(monthOffset - 1); return { start: s, end: s }; }
  if (period === "weekly") { const mon = mondayOf(new Date()); const pMon = new Date(mon); pMon.setDate(mon.getDate() - 7); const pSun = new Date(mon); pSun.setDate(mon.getDate() - 1); return { start: toStr(pMon), end: toStr(pSun) }; }
  const now = new Date();
  const first = new Date(now.getFullYear(), now.getMonth() + monthOffset - 1, 1);
  const last = new Date(now.getFullYear(), now.getMonth() + monthOffset, 0);
  return { start: toStr(first), end: toStr(last) };
}
function cumulativeSeries(events, days) {
  const sorted = [...events].sort((a, b) => (a.date < b.date ? -1 : 1));
  let idx = 0, running = 0;
  return days.map((d) => { while (idx < sorted.length && sorted[idx].date <= d) { running += sorted[idx].amount; idx++; } return running; });
}
function rangeDays(period) {
  const days = [];
  const n = period === "weekly" ? 6 : new Date().getDate() - 1;
  for (let i = n; i >= 0; i--) days.push(daysAgoStr(i));
  days.push(todayStr());
  return [...new Set(days)];
}

/* ============ State ============ */
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    let d = raw ? { ...DEFAULT_DATA, ...JSON.parse(raw) } : { ...DEFAULT_DATA };
    if ((d.seedVersion || 0) < SEED_VERSION) {
      d.transactions = SEED_TRANSACTIONS;
      d.categories = Array.from(new Set([...(d.categories || []), "Investment", "Transfer"]));
      d.wealthKeywords = SEED_WEALTH_KEYWORDS;
      const base = { ...(d.wealthInstrumentBase || {}) };
      Object.keys(SEED_WEALTH_VALUES).forEach((k) => {
        const net = d.transactions.filter((t) => matchKeyword(t, [k]) === k).reduce((s, t) => s + t.amount, 0);
        base[k] = SEED_WEALTH_VALUES[k] - net;
      });
      d.wealthInstrumentBase = base;
      d.seedVersion = SEED_VERSION;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch (e) {}
    }
    return d;
  } catch (e) {}
  const net = (k) => SEED_TRANSACTIONS.filter((t) => matchKeyword(t, [k]) === k).reduce((s, t) => s + t.amount, 0);
  const base = {}; Object.keys(SEED_WEALTH_VALUES).forEach((k) => (base[k] = SEED_WEALTH_VALUES[k] - net(k)));
  return { ...DEFAULT_DATA, transactions: SEED_TRANSACTIONS, wealthKeywords: SEED_WEALTH_KEYWORDS, wealthInstrumentBase: base, seedVersion: SEED_VERSION };
}
let data = loadData();
let ui = { tab: "dashboard", monthOffset: 0, txPage: 0, chartPeriod: "weekly", cashoutOpen: false, wealthAddOpen: false, quickAddOpen: false, dailyBudgetEditing: false, csvParsed: null, toast: "", maskNumbers: false, editingTxId: null };

const SUPABASE_URL = "https://rdlrokbxtvosxfqeoqcq.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkbHJva2J4dHZvc3hmcWVvcWNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NDYwODcsImV4cCI6MjEwMzIyMjA4N30.UwMLgEU8wbSjKGRDyIw_hSAMXZU8jKwIJR_Pe8mH4As";

function renderAuth() {

async function submitAuth(e) {
  e.preventDefault();
  const email = document.getElementById("auth-email").value.trim();
  const password = document.getElementById("auth-password").value;
  authError = ""; authBusy = true; renderAuth();
  const fn = authView === "login" ? sb.auth.signInWithPassword({ email, password }) : sb.auth.signUp({ email, password });

  authBusy = false;
  if (error) { authError = error.message; renderAuth(); return; }

async function loadCloudData() {

    if (row && row.data && Object.keys(row.data).length) {
      data = { ...DEFAULT_DATA, ...row.data };
      try { localStorage.setItem(STORAGE_KEY + "-cache-" + authUser.id, JSON.stringify(data)); } catch (e) {}
    } else {
      // First time this account has no cloud data yet.
      // Only pull leftover localStorage data as a one-time migration — and only
      // if it hasn't already been claimed by another account on this device.
      const alreadyClaimed = localStorage.getItem(STORAGE_KEY + "-claimed");
      data = alreadyClaimed ? { ...DEFAULT_DATA, seedVersion: SEED_VERSION } : loadData();
      try { localStorage.setItem(STORAGE_KEY + "-claimed", "1"); localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      await sb.from("app_data").upsert({ user_id: authUser.id, email: authUser.email, data, updated_at: new Date().toISOString() });
    }
  } catch (e) {
    console.error(e);
    try {
      const cached = localStorage.getItem(STORAGE_KEY + "-cache-" + authUser.id);
      data = cached ? { ...DEFAULT_DATA, ...JSON.parse(cached) } : { ...DEFAULT_DATA, seedVersion: SEED_VERSION };
    } catch (e2) { data = { ...DEFAULT_DATA, seedVersion: SEED_VERSION }; }
    showToast("Could not reach cloud — using last saved copy");
  }
  render();
}
async function initApp() {
  const { data: sessionData } = await sb.auth.getSession();
  authUser = sessionData.session ? sessionData.session.user : null;
  sb.auth.onAuthStateChange((event, session) => {
    const newUser = session ? session.user : null;
    const changed = (newUser && newUser.id) !== (authUser && authUser.id);
    authUser = newUser;
    if (authUser && changed) loadCloudData();
    else if (!authUser) { data = null; authView = "login"; renderAuth(); }
  });
  if (authUser) await loadCloudData();
  else renderAuth();
}

function save() {
  try { localStorage.setItem(STORAGE_KEY + "-cache-" + (authUser ? authUser.id : "anon"), JSON.stringify(data)); } catch (e) { showToast("Could not save — storage full?"); }
  if (authUser) {
    sb.from("app_data").upsert({ user_id: authUser.id, email: authUser.email, data, updated_at: new Date().toISOString() })
      .then(({ error }) => { if (error) { console.error(error); showToast("Cloud sync failed"); } });
  }
}
function persist(patch) { data = { ...data, ...patch }; save(); render(); }
function setUi(patch) { ui = { ...ui, ...patch }; render(); }
function showToast(msg) { ui.toast = msg; render(); clearTimeout(window.__toastT); window.__toastT = setTimeout(() => { ui.toast = ""; render(); }, 2400); }

function renderDashboard() {
  const period = data.viewPeriod || "monthly";
  const { start, end } = getRange(period, ui.monthOffset);
  const prev = getPrevRange(period, ui.monthOffset);
  const rangeTx = data.transactions.filter((t) => t.date >= start && t.date <= end);
  const prevTx = data.transactions.filter((t) => t.date >= prev.start && t.date <= prev.end);
  const realRangeTx = rangeTx.filter((t) => t.category !== "Transfer");
  const realPrevTx = prevTx.filter((t) => t.category !== "Transfer");

  const income = sumBy(realRangeTx, "income");
  const expense = sumBy(realRangeTx, "expense");
  const net = income - expense;
  const prevNet = sumBy(realPrevTx, "income") - sumBy(realPrevTx, "expense");
  const netDelta = net - prevNet;

  const byAccount = {};
  data.accounts.forEach((a) => (byAccount[a] = 0));
  data.transactions.forEach((t) => (byAccount[t.account] = (byAccount[t.account] || 0) + (t.type === "income" ? t.amount : -t.amount)));
  const totalBalance = Object.values(byAccount).reduce((s, v) => s + v, 0);
  const positiveAccounts = data.accounts.filter((a) => (byAccount[a] || 0) > 0);
  const positiveSum = positiveAccounts.reduce((s, a) => s + byAccount[a], 0) || 1;

  const byCategory = {};
  realRangeTx.filter((t) => t.type === "expense").forEach((t) => (byCategory[t.category] = (byCategory[t.category] || 0) + t.amount));
  const catRows = Object.entries(byCategory).sort((a, b) => b[1] - a[1]);
  const catTotal = catRows.reduce((s, [, v]) => s + v, 0) || 1;

  let bars = [];
  { const startD = new Date(start), endD = new Date(end);
    for (let d = new Date(startD); d <= endD; d.setDate(d.getDate() + 1)) {
      const dateStr = toStr(d);
      const dayTx = data.transactions.filter((t) => t.date === dateStr && t.category !== "Transfer");
      const label = period === "monthly" ? String(d.getDate()) : d.toLocaleDateString(undefined, { weekday: "short" });
      bars.push({ date: dateStr, income: sumBy(dayTx, "income"), expense: sumBy(dayTx, "expense"), label });
    }
  }
  const maxBar = Math.max(...bars.map((b) => Math.max(b.income, b.expense)), 1);

    : period === "weekly" ? "This week (Mon–Sun)" : monthDate.toLocaleString(undefined, { month: "long", year: "numeric" });
  const sortedTx = [...rangeTx].sort((a, b) => (a.date < b.date ? 1 : -1));
  const txTotalPages = Math.max(1, Math.ceil(sortedTx.length / 10));

function renderDailyProgress(expense, offset) {
  const budget = parseFloat(data.dailyBudget) || 0;
  const hasBudget = budget > 0;
  const pct = hasBudget ? Math.min((expense / budget) * 100, 100) : 0;
  const over = hasBudget && expense > budget;
  const spentLabel = offset === 0 ? "spent today" : offset === -1 ? "spent yesterday" : "spent that day";
  return `
    <div class="row-between" style="align-items:flex-end">
      <div>
        <div class="num" style="font-size:28px;font-weight:800">${cur(expense)}</div>
        <div style="font-size:12px;color:var(--text-soft);margin-top:4px">${spentLabel}</div>
      </div>
      <button class="btn btn-surface" onclick="setUi({dailyBudgetEditing:${!ui.dailyBudgetEditing}})">${hasBudget ? "✎ Edit daily limit" : "+ Set daily limit"}</button>
    </div>
    ${ui.dailyBudgetEditing ? `
      <div style="display:flex;gap:8px;margin-top:14px">
        <input type="number" id="daily-budget-input" placeholder="e.g. 150000" value="${esc(data.dailyBudget || "")}" style="flex:1;padding:9px 12px;border-radius:12px;border:1px solid var(--border);font-size:14px">
        <button class="btn btn-primary" onclick="saveDailyBudget()">Save</button>
        <button class="btn btn-ghost" onclick="setUi({dailyBudgetEditing:false})">Cancel</button>
      </div>` : ""}
    ${hasBudget && !ui.dailyBudgetEditing ? `
      <div style="margin-top:18px">
        <div style="height:12px;border-radius:999px;overflow:hidden;background:var(--surface)">
          <div style="height:100%;border-radius:999px;background:${over ? "var(--danger-soft)" : "var(--primary)"};width:${pct}%"></div>
        </div>

function renderDonut(rows, total) {
  const size = 150, r = 55, c = 2 * Math.PI * r; let offset = 0;
  const segs = rows.map(([cat, amt]) => {
    const frac = amt / total, dash = frac * c;
    const seg = `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${colorFor(cat, data.categories)}" stroke-width="16" stroke-dasharray="${dash} ${c - dash}" stroke-dashoffset="${-offset}" />`;
    offset += dash; return seg;
  }).join("");
  return `
    <div style="position:relative;width:${size}px;height:${size}px">
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
        <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--border)" stroke-width="16" />
        ${segs}
      </svg>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">

      </div>
    </div>`;
}

function handleCsvFile(e) {
  const file = e.target.files[0]; if (!file) return;
  Papa.parse(file, { header: true, skipEmptyLines: true, complete: (res) => {
    const cols = res.meta.fields || [];
    const guess = (keys) => cols.find((c) => keys.some((k) => c.toLowerCase().includes(k)));
    ui.csvParsed = { fileName: file.name, headers: cols, rows: res.data,
      dateCol: guess(["date"]) || cols[0] || "", descCol: guess(["desc", "memo", "narrative", "detail"]) || cols[1] || "", amountCol: guess(["amount", "value", "debit", "credit"]) || cols[2] || "" };
    render();
  }, error: () => showToast("Could not read that file") });
}
function doCsvImport() {
  const p = ui.csvParsed;
  const dateCol = document.getElementById("csv-date").value, amountCol = document.getElementById("csv-amount").value, descCol = document.getElementById("csv-desc").value;
  const account = document.getElementById("csv-account").value, category = document.getElementById("csv-category").value, flip = document.getElementById("csv-flip").checked;
  const imported = p.rows.map((r) => {
    let amt = parseFloat(String(r[amountCol]).replace(/[^0-9.-]/g, "")); if (isNaN(amt)) return null;
    if (flip) amt = -amt;
    return { id: uid(), date: r[dateCol] || todayStr(), amount: Math.abs(amt), type: amt < 0 ? "expense" : "income", account, category, note: descCol ? r[descCol] : "" };
  }).filter(Boolean);
  data.transactions = [...imported, ...data.transactions]; save();
  showToast(`Imported ${imported.length} transactions`); ui.csvParsed = null; render();
}

let wealthEditing = false, wealthCoKeyword = null;
function renderWealth() {
  const keywords = data.wealthKeywords || [];
  const adjustments = data.wealthAdjustments || [];
  const detected = data.transactions.map((t) => ({ t, match: matchKeyword(t, keywords) })).filter((x) => x.match);
  const additionsSum = detected.reduce((s, x) => s + x.t.amount, 0);
  const cashoutSum = adjustments.reduce((s, a) => s + a.amount, 0);
  const netAuto = additionsSum - cashoutSum;
  const instrumentBaseSum = keywords.reduce((s, k) => s + instrumentBase(k), 0);
  const totalWealth = (parseFloat(data.wealthBase) || 0) + instrumentBaseSum + netAuto;
  if (!wealthCoKeyword) wealthCoKeyword = keywords[0] || "";

  const days = rangeDays(ui.chartPeriod);
  const dayLabels = days.map((d) => (ui.chartPeriod === "monthly" ? String(new Date(d).getDate()) : new Date(d).toLocaleDateString(undefined, { weekday: "short" })));

    const base = instrumentBase(k);
    return { keyword: k, values: cumulativeSeries(events, days).map((v) => v + base) };
  });
  const globalMax = Math.max(...series.flatMap((s) => s.values), 1);
  const globalMin = Math.min(...series.flatMap((s) => s.values), 0);
  const span = globalMax - globalMin || 1;
  const chartW = 560, chartH = 150;

  const history = [
    ...detected.map((x) => ({ id: x.t.id, date: x.t.date, label: x.t.note || x.t.category, keyword: x.match, amount: x.t.amount, kind: "addition" })),
    ...adjustments.map((a) => ({ id: a.id, date: a.date, label: a.note || `Cashout — ${a.keyword}`, keyword: a.keyword, amount: a.amount, kind: "cashout" })),
  ].sort((a, b) => (a.date < b.date ? 1 : -1));

  return `

      <button class="btn btn-outline" onclick="setUi({cashoutOpen:${!ui.cashoutOpen}, wealthAddOpen:false})">↘ Cash Out</button>
    </div>
    <p class="page-sub">Track your total net worth — update it manually anytime, or let it grow automatically when your expenses go toward investments.</p>

    ${ui.cashoutOpen ? `
      <form class="card" style="margin-bottom:20px" onsubmit="submitCashout(event)">
        <h2 style="margin:0 0 12px;font-size:14px;font-weight:600">Record a cash out</h2>
        <div class="grid-2" style="gap:12px">
          <div class="field">Instrument<select id="co-keyword">${keywords.map((k) => `<option>${esc(k)}</option>`).join("")}</select></div>
          <div class="field">Amount (${data.currency})<input type="text" inputmode="numeric" id="co-amount" placeholder="0" oninput="formatAmountInput(this)"></div>
          <div class="field">Date<input type="date" id="co-date" value="${todayStr()}"></div>
          <div class="field">Deposit to account (optional)<select id="co-account"><option value="">Don't log as income</option>${data.accounts.map((a) => `<option>${esc(a)}</option>`).join("")}</select></div>
          <div class="field" style="grid-column:span 2">Note (optional)<input type="text" id="co-note" placeholder="e.g. partial withdrawal"></div>
        </div>
        <div style="display:flex;gap:8px;margin-top:16px">
          <button type="submit" class="btn btn-danger-soft">Record cash out</button>
          <button type="button" class="btn btn-ghost" onclick="setUi({cashoutOpen:false})">Cancel</button>
        </div>
      </form>` : ""}

    <div class="grid-dash" style="grid-template-columns:1fr">
      <div class="col">
        <div class="card">
          <div class="row-between">
            <div>
              <div style="font-size:12px;font-weight:500;color:var(--text-soft)">Total Wealth</div>
              <div class="num" style="font-size:28px;font-weight:800;margin-top:4px">${cur(totalWealth)}</div>
            </div>
            <button class="btn btn-surface" onclick="setUi({wealthAddOpen:${!ui.wealthAddOpen}, cashoutOpen:false})">✎ Update</button>
          </div>
          <div style="display:flex;gap:16px;margin-top:12px;font-size:12px">
            ${additionsSum > 0 ? `<span style="color:var(--success)">▲ +${cur(additionsSum)} added</span>` : ""}
            ${cashoutSum > 0 ? `<span style="color:var(--danger)">▼ -${cur(cashoutSum)} cashed out</span>` : ""}
          </div>
          ${ui.wealthAddOpen ? `
            <form onsubmit="submitInstrumentUpdate(event)" style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border)">
              <p style="font-size:12px;color:var(--text-soft);margin:0 0 10px">Since this isn't connected to Bibit, GoTrade, or your other apps, tell it what each instrument is actually worth right now.</p>
              <div class="grid-2" style="gap:12px">
                <div class="field">Instrument<select id="iv-keyword">${keywords.length === 0 ? `<option value="">Add a keyword first</option>` : keywords.map((k) => `<option>${esc(k)}</option>`).join("")}</select></div>
                <div class="field">Current value (${data.currency})<input type="text" inputmode="numeric" id="iv-value" placeholder="e.g. 500000" oninput="formatAmountInput(this)"></div>
              </div>
              <div style="display:flex;gap:8px;margin-top:14px">
                <button type="submit" class="btn btn-primary">Save value</button>
                <button type="button" class="btn btn-ghost" onclick="setUi({wealthAddOpen:false})">Cancel</button>
              </div>
            </form>` : ""}
        </div>

        <div class="card">
          <div class="row-between" style="margin-bottom:4px">
            <h2 style="margin:0;font-size:15px;font-weight:600">Instrument Performance</h2>
            <div class="toggle-surface">
              ${["weekly", "monthly"].map((p) => `<button class="${ui.chartPeriod === p ? "active" : ""}" onclick="setUi({chartPeriod:'${p}'})">${p}</button>`).join("")}
            </div>
          </div>
          <p style="font-size:12px;color:var(--text-soft);margin:0 0 16px">Cumulative value per instrument, ${ui.chartPeriod === "weekly" ? "last 7 days" : "this month"}</p>
          ${keywords.length === 0 ? `<div class="empty-msg">Add an investment keyword to see its trend here.</div>` : `
            <div style="position:relative">
              <svg width="100%" viewBox="0 0 ${chartW} ${chartH}" preserveAspectRatio="none" style="height:150px;display:block">
                <line x1="0" y1="${chartH - ((0 - globalMin) / span) * chartH}" x2="${chartW}" y2="${chartH - ((0 - globalMin) / span) * chartH}" stroke="var(--border)" stroke-width="1" />
                ${series.map((s) => {
                  const pts = s.values.map((v, i) => { const x = days.length > 1 ? (i / (days.length - 1)) * chartW : 0; const y = chartH - ((v - globalMin) / span) * chartH; return `${x},${y}`; });
                  return `<polyline points="${pts.join(" ")}" fill="none" stroke="${keywordColor(s.keyword, keywords)}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />`;
                }).join("")}
              </svg>
              <div style="position:absolute;inset:0;display:flex">
                ${days.map((d, i) => `
                  <div class="bar-col" style="flex:1;height:100%" onmouseenter="this.querySelector('.bar-tip').style.display='block'" onmouseleave="this.querySelector('.bar-tip').style.display='none'" onclick="const t=this.querySelector('.bar-tip'); t.style.display = t.style.display==='block' ? 'none' : 'block'">
                    <div class="bar-tip">
                      <div class="tip-title">${dayLabels[i]} · ${d}</div>
                      ${series.map((s) => `<div class="tip-row"><span style="display:flex;align-items:center;gap:6px"><span class="dot" style="background:${keywordColor(s.keyword, keywords)}"></span>${esc(s.keyword)}</span><b>${cur(s.values[i] || 0)}</b></div>`).join("")}
                    </div>
                  </div>`).join("")}
              </div>
            </div>
            <div class="row-between" style="font-size:10px;color:var(--text-soft);margin-top:4px"><span>${dayLabels[0]}</span><span>${dayLabels[dayLabels.length - 1]}</span></div>
            <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:14px">
              ${series.map((s) => `<span style="display:flex;align-items:center;gap:6px;font-size:12px"><span class="dot" style="background:${keywordColor(s.keyword, keywords)}"></span>${esc(s.keyword)}<span class="num" style="color:var(--text-soft)">${cur(s.values[s.values.length - 1] || 0)}</span></span>`).join("")}
            </div>`}
        </div>

        <div class="card">
          <h2 style="margin:0 0 4px;font-size:15px;font-weight:600">Transaction History</h2>
          <p style="font-size:12px;color:var(--text-soft);margin:0 0 12px">Additions detected from your expenses, plus any cash outs you've recorded.</p>
          ${history.length === 0 ? `<div class="empty-msg">Nothing yet. Try logging an expense with "Bibit" or another keyword in the note.</div>` : history.slice(0, 12).map((h) => `
            <div class="list-row">
              <div style="display:flex;align-items:center;gap:12px">
                <span class="dot" style="background:${keywordColor(h.keyword, keywords)}"></span>
                <div><div style="font-size:14px;font-weight:500">${esc(h.label)}</div><div style="font-size:12px;color:var(--text-soft)">${fmtDate(h.date)} · ${esc(h.keyword)}</div></div>
              </div>
              <div style="display:flex;align-items:center;gap:10px">
                <span class="num" style="font-size:14px;font-weight:600;color:${h.kind === "addition" ? "var(--success)" : "var(--danger)"}">${h.kind === "addition" ? "+" : "-"}${cur(h.amount)}</span>
              </div>
            </div>`).join("")}
        </div>
      </div>
    </div>
  `;
}
function submitInstrumentUpdate(e) {
  e.preventDefault();
  const keyword = document.getElementById("iv-keyword").value;
  const entered = parseAmountInput(document.getElementById("iv-value").value);
  if (!keyword || !entered) { showToast("Choose an instrument and enter a value"); return; }
  const newBase = entered - keywordNet(keyword);
  const map = { ...(data.wealthInstrumentBase || {}), [keyword]: newBase };
  persist({ wealthInstrumentBase: map });
  showToast(`${keyword} set to ${data.currency}${fmtNum(entered)}`);
  ui.wealthAddOpen = false; render();
}
function addWealthKeyword() { const v = document.getElementById("new-keyword").value.trim(); if (!v || (data.wealthKeywords || []).includes(v)) return; persist({ wealthKeywords: [...(data.wealthKeywords || []), v] }); }
function removeWealthKeyword(k) { persist({ wealthKeywords: (data.wealthKeywords || []).filter((x) => x !== k) }); }
function submitCashout(e) {
  e.preventDefault();
  const keyword = document.getElementById("co-keyword").value, amount = parseAmountInput(document.getElementById("co-amount").value);
  const date = document.getElementById("co-date").value || todayStr(), account = document.getElementById("co-account").value, note = document.getElementById("co-note").value;
  if (!amount || amount <= 0 || !keyword) { showToast("Choose an instrument and amount"); return; }
  const adj = { id: uid(), date, keyword, amount, note };
  data.wealthAdjustments = [adj, ...(data.wealthAdjustments || [])];
  if (account) data.transactions = [{ id: uid(), date, amount, type: "income", account, category: "Cashout", note: note || `Cashout from ${keyword}` }, ...data.transactions];
  save(); showToast("Cashout recorded"); ui.cashoutOpen = false; render();
}

/* ============ Init ============ */
initApp();
</script>
</body>
</html>
